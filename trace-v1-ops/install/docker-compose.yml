version: "3.8"

services:
  db:
    image: postgres:14-alpine
    container_name: trace_db
    restart: always
    environment:
      POSTGRES_USER: trace_user
      POSTGRES_PASSWORD: trace_pass_2024
      POSTGRES_DB: trace_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace_user -d trace_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trace-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trace_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs/backend:/app/logs
      - ./static:/app/static
    environment:
      DATABASE_URL: postgresql://trace_user:trace_pass_2024@db:5432/trace_db
      POSTGRES_USER: trace_user
      POSTGRES_PASSWORD: trace_pass_2024
      POSTGRES_DB: trace_db
    networks:
      - trace-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trace_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - trace-network

networks:
  trace-network:
    driver: bridge

volumes:
  pgdata: